name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  NODE_VERSION: '22'

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 诊断：确认工具链与本地 bin 是否就绪（排查 exit 127 类问题）
      - name: Toolchain diagnostics
        run: |
          echo "node: $(node -v)  npm: $(npm -v)"
          echo "--- local bins ---"
          ls node_modules/.bin | grep -E '^(eslint|tsc|vitest|vite)$' || echo "expected bins MISSING"
          echo "--- npm ls (top-level dev) ---"
          npm ls --depth=0 2>&1 | head -40 || true

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Unit tests
        run: npm test

      - name: Build extension
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-dist
          path: dist/
          retention-days: 14
