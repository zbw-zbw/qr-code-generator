name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  NODE_VERSION: '22'

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # npm ci 失败时把错误尾部写入 annotation，便于免登录排查
      - name: Install dependencies
        run: |
          set -o pipefail
          if ! npm ci 2>&1 | tee npm-ci.log; then
            echo "::error::npm ci failed -> $(tail -c 900 npm-ci.log | tr '\n' ' ')"
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Unit tests
        run: npm test

      - name: Build extension
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-dist
          path: dist/
          retention-days: 14
